[project]
name = "backstreet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "speakeasy-emulator==2.0.0b9",
]

[dependency-groups]
dev = [
    "mypy",
    "pip-audit",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["worker/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
files = ["worker"]
exclude = ["worker/tests/"]
