[tool.pytest.ini_options]
testpaths = ["worker/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
files = ["worker"]
exclude = ["worker/tests/"]
