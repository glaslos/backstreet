name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf generate
      - run: git diff --exit-code

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check worker
      - run: uv run mypy worker
      - run: uv run pytest
      - run: uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt
      - run: uv run pip-audit -r /tmp/requirements.txt

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t backstreet-api .
      - run: docker build -f worker/Dockerfile -t backstreet-worker .
      - uses: docker/scout-action@v1
        with:
          command: cves
          image: local://backstreet-api
          only-severities: critical,high
          exit-code: true
      - uses: docker/scout-action@v1
        with:
          command: cves
          image: local://backstreet-worker
          only-severities: critical,high
          exit-code: true
